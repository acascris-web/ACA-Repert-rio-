function norm(v){try{return (v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}catch(e){return (v||'').toLowerCase()}}
function id(x,i){return norm(x.title).replace(/[^a-z0-9]+/g,'-')+'-'+i}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 const q=norm(document.getElementById('search').value.trim()), lib=document.getElementById('library'); let groups={}, visible=0, seen=0;
 seed.forEach((x,i)=>{const k=id(x,i), st=state[k]||{}; if(st.hidden)return; const watched=st.watched ?? (x.status==='Assistido'); if(watched) seen++;
  if(statusFilter==='seen'&&!watched)return; if(statusFilter==='todo'&&watched)return;
  const hay=norm(JSON.stringify(x)+' '+(st.note||'')); if(q&&!hay.includes(q)) return; visible++;

 }

}
